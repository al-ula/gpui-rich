[package]
name = "docs-viewer-web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["mermaid"]
mermaid = ["gpui-rich/mermaid"]
gpui-fast = ["gpui-rich/gpui-fast", "gpui-kit/gpui-fast"]

[dependencies]
gpui-kit = { version = "0.10.0", default-features = false }
gpui-rich = { path = "../.." }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"
log = "0.4"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window"] }
