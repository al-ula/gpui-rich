[workspace]
resolver = "2"
members = [
    ".",
    "examples/docs_viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
gpui-kit = { version = "0.10.0", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"

[package]
name = "gpui-rich"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["gpui"]
gpui = ["dep:gpui-kit"]
gpui-fast = ["gpui", "gpui-kit/gpui-fast"]

[dependencies]
gpui-kit = { workspace = true, optional = true }
regex = "1"
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
unicode-bidi = "0.3.18"
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true

[[test]]
name = "extension_type_safety"
required-features = ["gpui"]

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"
