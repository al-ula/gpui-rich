[package]
name = "gpui-rich"
version = "0.1.0-pre.1"
edition = "2024"
license = "Apache-2.0 OR MIT"

[features]
default = ["gpui"]
gpui = ["dep:base64", "dep:gpui-kit"]
gpui-fast = ["gpui", "gpui-kit/gpui-fast"]
mermaid = ["dep:merman"]

[dependencies]
base64 = { version = "0.22", optional = true }
gpui-kit = { version = "0.10.0", default-features = false, optional = true }
merman = { version = "0.11.0", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
smallvec = { version = "1", features = ["serde"] }
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1"
unicode-segmentation = "1"

[[example]]
name = "docs_viewer"
required-features = ["gpui"]

[[test]]
name = "extension_type_safety"
required-features = ["gpui"]

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"
